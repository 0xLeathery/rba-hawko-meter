name: 'Setup Python pipeline'
description: 'Install Python and pipeline requirements (checkout remains in the workflow)'

inputs:
  python-version:
    description: 'Python version'
    required: false
    default: '3.11'
  install-dev:
    description: >-
      Also install requirements-dev.txt. Truthy when the value is true/TRUE/True
      (case-insensitive). Any other value (including default false) skips dev deps.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'

    - name: Install dependencies
      shell: bash
      run: |
        pip install -r requirements.txt
        install_dev="$(printf '%s' "${{ inputs.install-dev }}" | tr '[:upper:]' '[:lower:]')"
        if [ "$install_dev" = "true" ]; then
          pip install -r requirements-dev.txt
        fi
