name: Live Source Canary

# Catches ABS/RBA/ASX endpoint breakage without waiting for Monday weekly.
on:
  schedule:
    - cron: '17 4 * * 1,4'   # Mon + Thu 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python pipeline
        uses: ./.github/actions/setup-python-pipeline
        with:
          install-dev: 'true'

      - name: Run live source tests
        run: python -m pytest tests/python/ -m live -v --tb=short

      - name: Summarize canary result
        if: always()
        run: |
          echo "## Live Source Canary" >> "$GITHUB_STEP_SUMMARY"
          echo "Conclusion: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Open/update issue on failure
        if: failure()
        uses: ./.github/actions/report-pipeline-failure
        with:
          title: 'pipeline-failure: live source canary failed'
          body: |
            ## Live source canary failed

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            One or more `@pytest.mark.live` checks failed (ABS / RBA / ASX / scrapers).
            Investigate before the next weekly pipeline run.

      - name: Close pipeline-failure issue on success
        if: success()
        continue-on-error: true
        uses: ./.github/actions/report-pipeline-failure
        with:
          mode: close
          title: 'pipeline-failure: live source canary failed'
          body: |
            ## Live source canary recovered

            Successful run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Closing this issue automatically.

