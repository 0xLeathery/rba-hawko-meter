name: Live Source Canary

# Catches ABS/RBA/ASX endpoint breakage without waiting for Monday weekly.
on:
  schedule:
    - cron: '17 4 * * 1,4'   # Mon + Thu 04:17 UTC
  workflow_dispatch:

concurrency:
  group: live-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run live source tests
        run: python -m pytest tests/python/ -m live -v --tb=short

      - name: Summarize canary result
        if: always()
        run: |
          echo "## Live Source Canary" >> "$GITHUB_STEP_SUMMARY"
          echo "Conclusion: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Open/update issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'pipeline-failure: live source canary failed';
            const label = 'pipeline-failure';
            const body = [
              '## Live source canary failed',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'One or more `@pytest.mark.live` checks failed (ABS / RBA / ASX / scrapers).',
              'Investigate before the next weekly pipeline run.',
            ].join('\n');
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'B60205',
                  description: 'Automated data pipeline / source failure',
                });
              } else {
                throw e;
              }
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 20,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
