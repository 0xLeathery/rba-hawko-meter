name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint + unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python pipeline
        uses: ./.github/actions/setup-python-pipeline
        with:
          install-dev: 'true'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        # Skip postinstall lefthook (not needed in CI; hooks are local-only)
        run: npm ci --ignore-scripts

      - name: Run fast verify suite
        run: npm run verify:fast
